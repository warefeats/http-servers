name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    uses: warefeats/workflows/.github/workflows/bun-verify.yml@main

  # Every candidate of the framework lane builds from its pinned release.
  servers:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      # Spring Boot's Maven build needs Java 25, and Express's npm install the Node.js the rig runs it on
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      - uses: actions/setup-node@v7
        with:
          node-version: "26.13.0"
      - run: bun install --frozen-lockfile
      - run: bun run src/build.ts --lane=frameworks
