AWSTemplateFormatVersion: "2010-09-09"
Description: GitHub OIDC role for the cloud rig workflow of warefeats/http-servers

Parameters:
  GitHubOrg:
    Type: String
    Default: warefeats
  GitHubRepository:
    Type: String
    Default: http-servers
  GitHubEnvironment:
    Type: String
    Default: http-servers-bench
    Description: The environment the rig workflow's jobs run in; only its jobs can assume the role.
  GitHubOrgId:
    Type: String
    Default: "322872963"
    Description: Numeric org ID (gh api orgs/warefeats -q .id).
  RepositoryId:
    Type: String
    Description: Numeric repository ID (gh api repos/warefeats/http-servers -q .id). Required for immutable ID-form subject claims.
  ExistingOidcProviderArn:
    Type: String
    Default: ""
    Description: Supply the account's existing token.actions.githubusercontent.com provider ARN, or leave empty to create one.

Conditions:
  CreateOidcProvider: !Equals [!Ref ExistingOidcProviderArn, ""]

Resources:
  OidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateOidcProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      ThumbprintList:
        - 6938fd4d98bab03faadb97b34396831e3780aea1

  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: http-servers-github-deploy
      Description: Launches the http-servers cloud rig's instances and drives them over SSM.
      # a pass's job holds one session for up to six hours
      MaxSessionDuration: 21600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - CreateOidcProvider
                - !Ref OidcProvider
                - !Ref ExistingOidcProviderArn
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                token.actions.githubusercontent.com:sub:
                  - !Sub repo:${GitHubOrg}/${GitHubRepository}:environment:${GitHubEnvironment}
                  - !Sub "repo:${GitHubOrg}@${GitHubOrgId}/${GitHubRepository}@${RepositoryId}:environment:${GitHubEnvironment}"
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/PowerUserAccess
      Policies:
        - PolicyName: http-servers-bench-operations
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: LaunchTaggedInstances
                Effect: Allow
                Action:
                  - ec2:RunInstances
                Resource:
                  - !Sub "arn:aws:ec2:*:${AWS::AccountId}:instance/*"
                Condition:
                  StringEquals:
                    aws:RequestTag/Project: http-servers-bench
              - Sid: LaunchSupportResources
                Effect: Allow
                Action:
                  - ec2:RunInstances
                Resource:
                  - !Sub "arn:aws:ec2:*:${AWS::AccountId}:launch-template/*"
                  - !Sub "arn:aws:ec2:*:${AWS::AccountId}:security-group/*"
                  - !Sub "arn:aws:ec2:*:${AWS::AccountId}:subnet/*"
                  - !Sub "arn:aws:ec2:*:${AWS::AccountId}:volume/*"
                  - !Sub "arn:aws:ec2:*:${AWS::AccountId}:network-interface/*"
                  - !Sub "arn:aws:ec2:*:${AWS::AccountId}:placement-group/*"
                  - !Sub "arn:aws:ec2:*::image/*"
              - Sid: TagOnCreate
                Effect: Allow
                Action:
                  - ec2:CreateTags
                Resource:
                  - !Sub "arn:aws:ec2:*:${AWS::AccountId}:instance/*"
                  - !Sub "arn:aws:ec2:*:${AWS::AccountId}:volume/*"
                Condition:
                  StringEquals:
                    ec2:CreateAction: RunInstances
              - Sid: ManageTaggedInstances
                Effect: Allow
                Action:
                  - ec2:TerminateInstances
                  - ec2:StopInstances
                Resource: "*"
                Condition:
                  StringEquals:
                    ec2:ResourceTag/Project: http-servers-bench
              - Sid: DescribeCompute
                Effect: Allow
                Action:
                  - ec2:DescribeInstances
                  - ec2:DescribeInstanceStatus
                  - ec2:DescribeInstanceTypeOfferings
                  - ec2:DescribeLaunchTemplates
                  - ec2:DescribeLaunchTemplateVersions
                  - ec2:DescribeAvailabilityZones
                  - ec2:DescribeSubnets
                Resource: "*"
              - Sid: SSMOrchestration
                Effect: Allow
                Action:
                  - ssm:SendCommand
                  - ssm:GetCommandInvocation
                  - ssm:DescribeInstanceInformation
                Resource: "*"
              - Sid: BenchResultsObjects
                Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                Resource: !Sub "arn:aws:s3:::warefeats-http-servers-results-${AWS::AccountId}/*"
              - Sid: BenchResultsList
                Effect: Allow
                Action:
                  - s3:ListBucket
                Resource: !Sub "arn:aws:s3:::warefeats-http-servers-results-${AWS::AccountId}"
              - Sid: DescribeStacks
                Effect: Allow
                Action:
                  - cloudformation:DescribeStacks
                Resource: !Sub "arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/WarefeatsHttpServersBench/*"
              - Sid: PassBenchInstanceRole
                Effect: Allow
                Action: iam:PassRole
                Resource: !Sub "arn:aws:iam::${AWS::AccountId}:role/WarefeatsHttpServersBench-*"

Outputs:
  RoleArn:
    Description: Stored as the AWS_ROLE_ARN secret of the http-servers-bench environment of warefeats/http-servers.
    Value: !GetAtt DeployRole.Arn
