# Apache httpd bench server (docs/adr/0001-what-the-benchmark-answers.md, "The servers"): Ubuntu 24.04's apache2
# with the event MPM it enables by default and the values its packaged configuration sets, serving the agent's
# static files. It serves /16k, /323k and /file only: it builds no body per request.
# The launcher sets APACHE_MODULES and APACHE_STATE; the agent sets ADDR and STATIC_DIR.

LoadModule mpm_event_module ${APACHE_MODULES}/mod_mpm_event.so
LoadModule authz_core_module ${APACHE_MODULES}/mod_authz_core.so
LoadModule mime_module ${APACHE_MODULES}/mod_mime.so
# ForceType below sets every file's type, so mod_mime needs no table of them
TypesConfig /dev/null

ServerName localhost
PidFile ${APACHE_STATE}/apache2.pid
Mutex file:${APACHE_STATE} default
ErrorLog ${APACHE_STATE}/error.log
LogLevel warn

# Ubuntu's apache2.conf: the user the workers run as when started as root, and its timeouts
User www-data
Group www-data
Timeout 300
KeepAlive On
MaxKeepAliveRequests 100
KeepAliveTimeout 5

# Ubuntu's mods-available/mpm_event.conf
StartServers 2
MinSpareThreads 25
MaxSpareThreads 75
ThreadLimit 64
ThreadsPerChild 25
MaxRequestWorkers 150
MaxConnectionsPerChild 0

Listen ${ADDR}
# the one equalization: actix-web's listen backlog of 1,024 (Apache's own default is 511)
ListenBacklog 1024
EnableSendfile On
# no access log, as no other server writes one

DocumentRoot "${STATIC_DIR}"
<Directory "${STATIC_DIR}">
	Require all granted
	ForceType application/octet-stream
</Directory>
